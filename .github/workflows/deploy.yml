name: Deploy GoMach to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        # --no-frozen-lockfile: CI machines may differ from dev (platform-specific binaries)
        # --config.minimumReleaseAge=0: bypass the 1440-min age check that's Replit-dev-only
        run: pnpm install --no-frozen-lockfile --config.minimumReleaseAge=0

      - name: Build GoMach site
        working-directory: artifacts/gomach
        env:
          PORT: "3000"
          # Use /gomach.uk/ until custom domain gomach.uk is active.
          # Once gomach.uk DNS is pointed at GitHub Pages, change BASE_PATH to: /
          BASE_PATH: /gomach.uk/
          NODE_ENV: production
          # Get your free key at https://web3forms.com — enter info@gomach.uk
          # Add it in GitHub: Settings > Secrets > Actions > VITE_WEB3FORMS_KEY
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/gomach/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
